
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AroundBite - My Profile</title>
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="styles/profile.css">
</head>
<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="logo">AroundBite<span>.</span></a>

            <p class="menu-title">MENU</p>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <img src="assets/images/house.svg" alt="" class="nav-icon">
                    <span>Dashboard</span>
                </a>

                <a href="mealPlanner.html" class="nav-link">
                    <img src="assets/images/calendar-days.svg" alt="" class="nav-icon">
                    <span>Meal Planner</span>
                </a>

                <a href="exploreFood.html" class="nav-link">
                    <img src="assets/images/utensils.svg" alt="" class="nav-icon">
                    <span>Explore Food</span>
                </a>

                <a href="budget.html" class="nav-link">
                    <img src="assets/images/wallet.svg" alt="" class="nav-icon">
                    <span>Budget Tracker</span>
                </a>

                <a href="profile.html" class="nav-link active">
                    <img src="assets/images/user-round.svg" alt="" class="nav-icon">
                    <span>My Profile</span>
                </a>

                <a href="bmi.html" class="nav-link" aria-current="page">
                  <img src="assets/images/calculator.svg" alt="" class="nav-icon">
                <span>BMI Calculator</span>
            </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="sidebar-note">
                    <p class="note-title">A little reminder</p>
                    <p>Eat well, live well.</p>
                </div>

                <a href="index.html" class="back-link">
                    <img src="assets/images/undo-2.svg" alt="" class="nav-icon">
                    <span>Back to Home</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="welcome">
                <div class="welcome-text">
                    <p class="eyebrow">USER ACCOUNT</p>
                    <h1>My Profile</h1>
                    <p>Manage your account information and culinary preferences here.</p>
                </div>

                <button type="button" id="toggle-edit-btn" class="primary-button">
                    Edit Profile
                </button>
            </div>

            <div class="profile-card">

                <!-- Avatar Section -->
                <div class="profile-header">
                    <div class="avatar-container">
                        <img src="assets/images/user-round.svg"
                             alt="Profile Picture"
                             id="avatar-img">
                    </div>

                    <div class="profile-title">
                        <h2 id="display-username">Username</h2>
                        <p id="display-role">AroundBite user</p>
                    </div>
                </div>

                <!-- Profile Data -->
                <div class="profile-details" id="profile-details-container">
                </div>

                <!-- Add New Field -->
                <div id="add-field-container" class="add-field-container hidden">
                    <hr class="divider">

                    <p class="add-field-title">Tambah Informasi Baru</p>

                    <div class="add-field-inputs">
                        <input type="text" id="new-label-input"
                               placeholder="Label (misal: Alamat, Bio, dll)">

                        <input type="text" id="new-value-input"
                               placeholder="Isi data">

                        <button type="button" id="add-field-btn"
                                class="secondary-button-sm">
                            + Tambah Data
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript Profile -->
    <script>
        // Data profile awal
        const defaultProfileData = [
            { id: "username", label: "Username", value: "Charlie", type: "text" },
            { id: "email", label: "Email Address", value: "Charlie123e@example.com", type: "email" },
            { id: "height", label: "Height (cm)", value: "175", type: "number" },
            { id: "weight", label: "Weight (kg)", value: "67", type: "number" },
            { id: "nomorTelp", label: "Nomor Telepon", value: "081234567890", type: "tel" }
        ];

        let profileData = [...defaultProfileData];
        let isEditing = false;

        const detailsContainer = document.getElementById("profile-details-container");
        const toggleEditBtn = document.getElementById("toggle-edit-btn");
        const addFieldContainer = document.getElementById("add-field-container");
        const displayUsername = document.getElementById("display-username");
        const labelInput = document.getElementById("new-label-input");
        const valueInput = document.getElementById("new-value-input");

        // Load saved profile
        function loadProfile() {
            const savedProfile = localStorage.getItem("aroundbite-profile");

            if (savedProfile) {
                try {
                    profileData = JSON.parse(savedProfile);
                } catch (error) {
                    profileData = [...defaultProfileData];
                }
            }
        }

        // Save profile to localStorage
        function saveProfile() {
            localStorage.setItem(
                "aroundbite-profile",
                JSON.stringify(profileData)
            );
        }

        // Display profile data
        function renderProfile() {
            detailsContainer.innerHTML = "";

            profileData.forEach((item, index) => {
                const fieldDiv = document.createElement("div");
                fieldDiv.className = "detail-item";

                if (isEditing) {
                    fieldDiv.innerHTML = `
                        <label for="field-${index}">${item.label}</label>

                        <div class="input-wrapper">
                            <input
                                type="${item.type || "text"}"
                                id="field-${index}"
                                value="${item.value || ""}"
                            >

                            ${index >= 4
                                ? `<button type="button"
                                           class="delete-btn"
                                           onclick="deleteField(${index})"
                                           aria-label="Delete ${item.label}">
                                       &times;
                                   </button>`
                                : ""}
                        </div>
                    `;
                } else {
                    fieldDiv.innerHTML = `
                        <span class="detail-label">${item.label}</span>
                        <span class="detail-value">${item.value || "-"}</span>
                    `;
                }

                detailsContainer.appendChild(fieldDiv);
            });

            const usernameObj = profileData.find(
                item => item.id === "username"
            );

            displayUsername.textContent =
                usernameObj?.value || "User";
        }

        // Toggle edit and save
        toggleEditBtn.addEventListener("click", function () {
            if (isEditing) {
                // Read input values before re-rendering
                profileData.forEach((item, index) => {
                    const input = document.getElementById(`field-${index}`);

                    if (input) {
                        item.value = input.value.trim();
                    }
                });

                saveProfile();

                isEditing = false;
                toggleEditBtn.textContent = "Edit Profile";
                addFieldContainer.classList.add("hidden");

                renderProfile();
                alert("Profile berhasil disimpan!");
            } else {
                isEditing = true;
                toggleEditBtn.textContent = "Simpan Perubahan";
                addFieldContainer.classList.remove("hidden");

                renderProfile();
            }
        });

        // Add new profile field
        document.getElementById("add-field-btn").addEventListener("click", function () {
            const label = labelInput.value.trim();
            const value = valueInput.value.trim();

            if (!label) {
                alert("Silakan masukkan label untuk data baru.");
                return;
            }

            profileData.push({
                id: "custom_" + Date.now(),
                label: label,
                value: value,
                type: "text"
            });

            saveProfile();

            labelInput.value = "";
            valueInput.value = "";

            renderProfile();
        });

        // Delete a profile field
        function deleteField(index) {
            profileData.splice(index, 1);
            saveProfile();
            renderProfile();
        }

        // Load saved data when the page opens
        loadProfile();
        renderProfile();
    </script>

</body>
</html>
